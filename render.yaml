# Render Blueprint for DDWF System.
#
# IMPORTANT: this service needs more than Render's free tier (512MB RAM,
# 0.1 CPU) provides. Just importing torch uses ~500MB RSS before a single
# request is served — see docs/DEPLOYMENT.md for the measured numbers and
# why. `plan: starter` below is the minimum that will actually run this
# without OOM-killing on the first request.
services:
  - type: web
    name: ddwf-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter        # 512MB/0.5 CPU — still tight; standard (2GB) is safer, see docs/DEPLOYMENT.md
    healthCheckPath: /health
    envVars:
      - key: DDWF_API_KEY
        sync: false       # set this in the Render dashboard, don't commit it
      - key: ENV
        value: production
      - key: DEVICE
        value: cpu
      - key: COARSE_FORECAST_PROVIDER
        value: open-meteo
      - key: COARSE_GRID_SIZE
        value: "8"
      - key: MAX_HORIZON_DAYS
        value: "16"
      - key: DOWNSCALER_CHECKPOINT
        value: ./checkpoints/diffusion_downscaler_v1.pt
