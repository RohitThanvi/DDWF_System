# Hydra config for the Satellite AOI Downscaling Head — Module 3 training run.
model:
  in_channels: 8
  cond_raster_channels: 8
  base_channels: 64
  channel_mults: [1, 2, 4, 8]
  raw_token_dim: 8          # must match len(OPEN_METEO_VARIABLES) in app/data/external_forecast.py
  context_dim: 64
  time_dim: 256

diffusion:
  schedule: cosine          # EDM/DDPM-style noise schedule
  train_timesteps: 1000
  sampling: ddim
  sampling_steps_eval: 16   # matches serving-time distilled sampler

data:
  # Built by scripts/build_aoi_pairs_manifest.py (Open-Meteo historical
  # coarse/fine pairs + real elevation-derived terrain — see that script's
  # docstring and docs/TRAINING.md for exactly what's real vs. proxy/stub).
  manifest_path: ./data/aoi_pairs_manifest.json
  aoi_patch_size: 32       # must match --fine-grid passed to build_aoi_pairs_manifest.py
  batch_size: 8
  grad_accum_steps: 4
  num_workers: 4

implicit_field:
  enabled: true            # jointly trains TerrainSIREN for zero-shot AOIs
  siren_omega_0: 30.0

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.0
  scheduler: cosine
  warmup_steps: 500

precision: bf16-mixed
attention_backend: standard  # nn.MultiheadAttention (app/models/layers.py). flash_attention_2 would need
                              # rewiring the model + adding flash-attn back to requirements-train.txt -- not
                              # done yet, see that file's comment on why it's deliberately left out

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: auto
  log_every_n_steps: 50

mlflow:
  tracking_uri: ./mlruns
  experiment_name: ddwf-downscaler
