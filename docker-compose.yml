services:
  ddwf-api:
    build: .
    image: ddwf-system:latest
    container_name: ddwf-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./checkpoints:/srv/checkpoints:ro
      - ./data/cache:/srv/data/cache
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ddwf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
